# Netlify Configuration for AI Content Creator

[build]
  # Base directory is the React frontend folder
  base = "react-frontend"
  # Build command (runs inside base directory)
  command = "npm install && npm run build"
  # Directory to publish (relative to base)
  publish = "build"

[build.environment]
  # Node version
  NODE_VERSION = "18"

# Redirect all API calls to backend server (set REACT_APP_API_URL in Netlify environment variables)
# No serverless functions needed - backend deployed separately

# SPA fallback - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and CORS
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

# Environment variables (set these in Netlify dashboard)
# OPENAI_API_KEY
# MONGODB_URI
# JWT_SECRET_KEY
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
